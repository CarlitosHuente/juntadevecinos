<div class="recorte-widget" data-ratio="{{ widget.ratio }}" data-etiqueta="{{ widget.etiqueta }}">
  {% if widget.is_initial and not widget.required %}
    <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="recorte-quitar-check" hidden>
  {% endif %}
  <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>

  <label class="recorte-caja" for="{{ widget.attrs.id }}">
    <span class="recorte-caja-icono">🖼</span>
    <span class="recorte-caja-titulo">Elegir imagen</span>
    <span class="recorte-caja-ayuda">Haz clic o arrástrala aquí · {{ widget.etiqueta }}</span>
  </label>

  <div class="recorte-vista" hidden>
    <p class="recorte-formato">{{ widget.etiqueta }}</p>
    <button type="button" class="recorte-marco" style="aspect-ratio: {{ widget.ratio }};" title="Pulsa para acomodar">
      <img class="recorte-foto" alt="Vista previa" draggable="false">
      <span class="recorte-toque">Pulsa la foto para moverla y encuadrarla</span>
    </button>
    <div class="recorte-controles" hidden>
      <label>Acercar <input class="recorte-zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <button type="button" class="recorte-centrar">Centrar</button>
      <button type="button" class="recorte-listo">Listo</button>
    </div>
    <div class="recorte-acciones">
      <label class="recorte-cambiar" for="{{ widget.attrs.id }}">Cambiar imagen</label>
      {% if widget.is_initial and not widget.required %}
        <button type="button" class="recorte-borrar">Quitar</button>
      {% endif %}
    </div>
  </div>
</div>
